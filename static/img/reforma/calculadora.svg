<g class="b"><text class="s" x="122" y="104">IBS · REFORMA</text><text class="d" x="122" y="152">17,7%<tspan class="cur">_</tspan></text></g>
<g>
<rect x="104" y="196" width="62" height="52" fill="#D9D9D9"/><text class="k" x="127" y="231">7</text>
