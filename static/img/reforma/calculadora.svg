<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" width="520" height="520" role="img" aria-label="Calculadora com CBS e IBS e blocos de porcentagem flutuando">
<style>
.d{font:900 54px 'Impact','Arial Narrow',sans-serif;fill:#F16A32;letter-spacing:1px}
.s{font:500 13px 'Consolas','Courier New',monospace;fill:#D9D9D9;letter-spacing:3px}
.p{font:900 22px 'Impact','Arial Narrow',sans-serif;fill:#1A1A1A}
.k{font:900 26px 'Impact','Arial Narrow',sans-serif;fill:#1A1A1A}
.a{opacity:0;animation:a 6s infinite}.b{opacity:0;animation:b 6s infinite}
@keyframes a{0%,4%{opacity:0}8%,44%{opacity:1}50%,100%{opacity:0}}
@keyframes b{0%,50%{opacity:0}56%,94%{opacity:1}100%{opacity:0}}
.f{animation:f 5s ease-in infinite;opacity:0}
.f2{animation-delay:1.6s}.f3{animation-delay:3.1s}.f4{animation-delay:4.2s}
@keyframes f{0%{transform:translateY(0);opacity:0}15%{opacity:1}85%{opacity:1}100%{transform:translateY(-120px);opacity:0}}
.t{animation:t 6s infinite}
@keyframes t{0%,12%,100%{fill:#D9D9D9}16%,22%{fill:#F16A32}}
.t2{animation:t 6s 3s infinite}
.cur{animation:c 1s steps(1) infinite}@keyframes c{50%{opacity:0}}
.sh{animation:sh 6s ease-in-out infinite;transform-origin:260px 330px}
@keyframes sh{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.a{opacity:1}.f{opacity:1}}
</style>
<ellipse cx="260" cy="492" rx="160" ry="12" fill="#000" opacity=".35"/>
