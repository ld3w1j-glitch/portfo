<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>WO · Gerador de peças</title>
<link rel="stylesheet" href="/static/css/base/tokens.css">
<link rel="stylesheet" href="/static/css/base/componentes.css">
<style>
body{height:100vh;overflow:hidden}
.app{display:grid;grid-template-columns:380px 1fr;height:100vh}
@media(max-width:860px){body{overflow:auto;height:auto}.app{grid-template-columns:1fr;height:auto}}
.painel{overflow:auto;border-right:1px solid var(--wo-linha);padding:22px 22px 40px;background:var(--wo-grafite)}
.painel h1{font-size:44px;margin:6px 0 4px}
.painel .sub{color:var(--wo-cinza);font-size:13px;margin-bottom:18px}
.grupo{margin-top:20px}
.grupo>.rotulo{display:block;margin-bottom:8px;font-size:10px}
label.campo{display:block;margin-bottom:10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--wo-cinza)}
.painel input[type=text],.painel textarea,.painel select{width:100%;margin-top:6px;background:var(--wo-grafite-2);color:var(--wo-offwhite);border:1px solid var(--wo-linha);padding:9px 10px;font:14px var(--f-texto);letter-spacing:0;text-transform:none}
.painel textarea{resize:vertical;min-height:70px}
.painel input:focus,.painel textarea:focus,.painel select:focus{outline:2px solid var(--wo-laranja);outline-offset:-1px}
.opcoes{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px}
.opcoes label{display:flex;align-items:center;gap:8px;font:13px var(--f-texto);cursor:pointer;color:var(--wo-offwhite)}
.opcoes input{accent-color:var(--wo-laranja);width:16px;height:16px}
.temas{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.temas button{height:44px;border:2px solid transparent;cursor:pointer;font:700 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase}
.temas button.ativo{border-color:var(--wo-laranja);outline:2px solid var(--wo-offwhite);outline-offset:1px}
.layouts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.layouts .tag{padding:10px;text-align:center}
.acoes{position:sticky;bottom:-40px;background:var(--wo-grafite);padding:16px 0 40px;margin-top:20px;display:grid;gap:10px;z-index:2}
.palco{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:
 repeating-conic-gradient(#222 0 25%,#262626 0 50%) 50%/24px 24px;min-height:0}
canvas{max-width:100%;max-height:calc(100vh - 80px);box-shadow:0 20px 60px rgba(0,0,0,.5)}
@media(max-width:860px){canvas{max-height:none}.palco{min-height:60vh}}
.info{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;color:var(--wo-cinza);text-transform:uppercase}
.dica{font-size:12px;color:var(--wo-cinza);margin-top:6px;letter-spacing:0;text-transform:none;font-family:var(--f-texto)}
</style>
</head>
<body>
<div class="app">
  <aside class="painel">
    <p class="rotulo"><span class="slashes"></span>&nbsp; WO · Ferramenta</p>
    <h1 class="display">Gerador de <span class="laranja">peças</span></h1>
    <p class="sub">Posts, stories, capas e banners com a identidade já aplicada. Edite e baixe o PNG.</p>

    <div class="grupo"><span class="rotulo">Formato</span>
      <select id="formato"></select></div>

    <div class="grupo"><span class="rotulo">Layout</span>
      <div class="layouts" id="layouts"></div></div>

    <div class="grupo"><span class="rotulo">Tema</span>
      <div class="temas" id="temas"></div></div>

    <div class="grupo"><span class="rotulo">Texto</span>
      <label class="campo">Título<textarea id="titulo" data-k="titulo"></textarea>
        <span class="dica">Use *asteriscos* para destacar na cor de acento. Enter quebra a linha.</span></label>
      <label class="campo">Subtítulo<input type="text" id="sub" data-k="sub"></label>
      <label class="campo">Rótulo do topo<input type="text" id="rotulo" data-k="rotulo"></label>
      <label class="campo">Tags (rodapé)<input type="text" id="tags" data-k="tags"></label>
      <label class="campo">Lista / contatos<textarea id="lista" data-k="lista"></textarea>
        <span class="dica">Serviços: uma linha por item, no formato Nome: descrição. Cartão: uma linha por contato.</span></label>
      <label class="campo">Contador (carrossel)<input type="text" id="num" data-k="num"></label>
    </div>

    <div class="grupo"><span class="rotulo">Fundo</span>
      <label class="campo">Padrão<select id="padrao" data-k="padrao"></select></label>
      <label class="campo">Intensidade do padrão<input type="range" id="op" data-k="op" min="3" max="50" value="12" style="width:100%;accent-color:var(--wo-laranja)"></label>
    </div>

    <div class="grupo"><span class="rotulo">Elementos</span>
      <div class="opcoes">
        <label><input type="checkbox" data-k="wogigante">WO gigante</label>
        <label><input type="checkbox" data-k="faixa">Faixa inclinada</label>
        <label><input type="checkbox" data-k="avatar">Avatar</label>
        <label><input type="checkbox" data-k="logo">Logo no topo</label>
        <label><input type="checkbox" data-k="selo">Selo WO Digital</label>
      </div>
    </div>

    <div class="grupo"><span class="rotulo">Imagens (Projeto · Antes e depois)</span>
      <label class="campo">Principal / Antes<input type="file" id="foto" accept="image/*" style="width:100%;color:var(--wo-cinza);font-size:12px"></label>
      <label class="campo">Depois<input type="file" id="foto2" accept="image/*" style="width:100%;color:var(--wo-cinza);font-size:12px"></label>
    </div>

    <div class="acoes">
      <button class="btn btn-primario cut-sm" id="baixar" style="justify-content:center">Baixar PNG ↓</button>
      <button class="btn cut-sm" id="baixarhtml" style="justify-content:center">Baixar HTML ↓</button>
      <button class="btn cut-sm" id="exemplo" style="justify-content:center">Carregar exemplo do layout</button>
    </div>
  </aside>

  <main class="palco">
    <canvas id="cv" width="1080" height="1350"></canvas>
    <span class="info" id="info"></span>
  </main>
</div>

const st = Object.assign({formato:'post', layout:'poster', tema:'escuro'}, BASE, EXEMPLOS.poster);

/* ---------------------------------------------------------------- imagens SVG embutidas */
const cache = new Map();
function loadImg(name, color, acc){
  const key = [name, color, acc || ''].join('|');
  if (cache.has(key)) return cache.get(key);
  const src = ASSETS[name];
  if (!src) return Promise.resolve(null);
  const svg = src.replaceAll('#1A1A1A','@@C').replaceAll('#F16A32','@@A').replaceAll('@@C',color).replaceAll('@@A',acc || '#F16A32');
  const p = new Promise(res => {
    const im = new Image();
    im.onload = () => res(im); im.onerror = () => res(null);
    im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
  cache.set(key, p); return p;
}

/* ---------------------------------------------------------------- texto */
const fontD = s => `900 ${s}px "Barlow Condensed","Arial Narrow",sans-serif`;
const fontT = s => `400 ${s}px Inter,system-ui,sans-serif`;

function parseRuns(text){
  const out = []; let acc = false;
  for (const line of String(text).split('\n')){
    const words = [];
    line.split(' ').forEach(w => {
      if (!w) return;
      const segs = []; let buf = '';
      for (const ch of w){
        if (ch === '*'){ if (buf){ segs.push({t:buf, a:acc}); buf=''; } acc = !acc; }
        else buf += ch;
      }
      if (buf) segs.push({t:buf, a:acc});
      if (segs.length) words.push(segs);
    });
    out.push(words);
  }
  return out;
}
function wrapRuns(ctx, runs, maxW, font, upper){
  ctx.font = font;
  const sp = ctx.measureText(' ').width, lines = []; let tooWide = false;
  for (const hard of runs){
    let cur = [], w = 0;
    for (const word of hard){
      const ww = word.reduce((a, sg) => a + ctx.measureText(upper ? sg.t.toUpperCase() : sg.t).width, 0);
      if (ww > maxW) tooWide = true;
      if (cur.length && w + sp + ww > maxW){ lines.push({words:cur, w}); cur = []; w = 0; }
      w += (cur.length ? sp : 0) + ww; cur.push({word, ww});
    }
    lines.push({words:cur, w});
  }
  return {lines, tooWide, sp};
}
function drawRuns(ctx, lay, x, y, size, lh, font, upper, fg, ac){
  ctx.font = font; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  lay.lines.forEach((ln, i) => {
    let cx = x;
    ln.words.forEach(({word}) => {
      word.forEach(sg => {
        const tx = upper ? sg.t.toUpperCase() : sg.t;
        ctx.fillStyle = sg.a ? ac : fg; ctx.fillText(tx, cx, y + i*size*lh);
        cx += ctx.measureText(tx).width;
      });
      cx += lay.sp;
    });
  });
}
function fitRuns(ctx, text, maxW, maxH, maxS, minS, lh){
  const runs = parseRuns(text);
  let last;
  for (let s = Math.round(maxS); s >= minS; s -= 2){
    const font = fontD(s), lay = wrapRuns(ctx, runs, maxW, font, true);
    last = {s, lay, font, h: lay.lines.length * s * lh};
    if (!lay.tooWide && last.h <= maxH) return last;
  }
  return last;
}
function monoText(ctx, txt, x, y, size, color, align='left', alpha=1, spacing=.25){
  ctx.save();
  ctx.font = `500 ${size}px "JetBrains Mono",ui-monospace,monospace`;
  ctx.fillStyle = color; ctx.globalAlpha = alpha; ctx.textBaseline = 'top'; ctx.textAlign = align;
  if ('letterSpacing' in ctx) ctx.letterSpacing = (size*spacing) + 'px';
  ctx.fillText(String(txt).toUpperCase(), x, y);
  const w = ctx.measureText(String(txt).toUpperCase()).width;
  ctx.restore(); return w;
}

/* ---------------------------------------------------------------- formas */
function slashes(ctx, x, y, s, color, n=3){
  ctx.fillStyle = color;
  for (let i = 0; i < n; i++){
    const x0 = x + i*18*s, w = 8*s, h = 24*s, k = 8*s;
    ctx.beginPath(); ctx.moveTo(x0, y+h); ctx.lineTo(x0+w, y+h); ctx.lineTo(x0+w+k, y); ctx.lineTo(x0+k, y); ctx.fill();
  }
}
function chamfer(ctx, x, y, w, h, c){
  ctx.beginPath(); ctx.moveTo(x+c, y); ctx.lineTo(x+w, y); ctx.lineTo(x+w, y+h-c);
  ctx.lineTo(x+w-c, y+h); ctx.lineTo(x, y+h); ctx.lineTo(x, y+c); ctx.closePath();
}
async function padrao(ctx, W, H, t){
  if (st.padrao === 'nenhum') return;
  const im = await loadImg(st.padrao, t.fg); if (!im) return;
  ctx.save(); ctx.globalAlpha = st.op/100;
  const size = Math.max(W, H); ctx.drawImage(im, 0, (H-size)/2 > 0 ? 0 : (H-size)/2, size, size);
  ctx.restore();
}

/* topo comum: slashes + rotulo + linha + logo */
async function topo(ctx, W, H, t, m, s, pad){
  slashes(ctx, pad, pad, s, t.bar);
  const sz = Math.max(13, m*.017);
  const lw = monoText(ctx, st.rotulo, pad + 72*s, pad + (24*s - sz)/2, sz, t.mut);
  let right = W - pad;
  if (st.logo){
    const im = await loadImg('monograma-wo', t.fg);
    if (im){ const h = Math.max(30, 46*s), w = h*im.naturalWidth/im.naturalHeight;
      ctx.drawImage(im, W-pad-w, pad + 12*s - h/2 + 0, w, h); right = W - pad - w - 26*s; }
  }
  const x0 = pad + 72*s + lw + 26*s;
  if (right > x0){ ctx.save(); ctx.globalAlpha = .28; ctx.fillStyle = t.fg; ctx.fillRect(x0, pad + 12*s, right - x0, Math.max(1.5, 1.5*s)); ctx.restore(); }
}
async function rodapeSelo(ctx, W, H, t, s, pad){
  if (!st.selo) return;
  const im = await loadImg('wo-digital', t.fg); if (!im) return;
  const h = Math.max(46, 78*s), w = h*im.naturalWidth/im.naturalHeight;
  ctx.drawImage(im, W-pad-w, H-pad-h, w, h);
}

/* bloco de texto: barra + título + subtítulo + tags */
function bloco(ctx, o){
  const {s, t, m} = o;
  const subS = Math.max(18, Math.min(36, m*.032)), tagS = Math.max(13, m*.019);
  const barH = 8*s, g1 = 26*s, g2 = 22*s, g3 = 30*s;
  const tagsH = (o.tags && st.tags) ? tagS*1.3 : 0;
  let subLay = null, subH = 0;
  if (st.sub){ subLay = wrapRuns(ctx, parseRuns(st.sub), o.maxW*.96, fontT(subS), false); subH = subLay.lines.length*subS*1.4; }
  const avail = o.bottom - o.top - barH - g1 - (subH ? g2+subH : 0) - (tagsH ? g3+tagsH : 0);
  const ti = fitRuns(ctx, st.titulo, o.maxW, Math.max(avail, 40), o.maxTitle, Math.max(22, o.maxTitle*.22), .92);
  const total = barH + g1 + ti.h + (subH ? g2+subH : 0) + (tagsH ? g3+tagsH : 0);
  let y = o.anchor === 'bottom' ? o.bottom - total : o.top + (o.bottom - o.top - total)/2;
  ctx.fillStyle = t.bar; ctx.fillRect(o.x, y, 64*s, barH); y += barH + g1;
  drawRuns(ctx, ti.lay, o.x, y, ti.s, .92, ti.font, true, t.fg, t.ac); y += ti.h;
  if (subH){ y += g2; drawRuns(ctx, subLay, o.x, y, subS, 1.4, fontT(subS), false, t.mut, t.ac); y += subH; }
  if (tagsH){ y += g3; monoText(ctx, st.tags, o.x, y, tagS, t.fg, 'left', .9); }
}

/* ---------------------------------------------------------------- layouts */
async function Lposter(ctx, W, H, t){
  const m = Math.min(W,H), s = m/1080, pad = Math.round(m*.06), wide = W/H > 1.5;
  await padrao(ctx, W, H, t);
  if (st.wogigante){
    const im = await loadImg('monograma-wo', t.fg);
    if (im){ const w = wide ? H*1.55 : W*1.02, h = w*im.naturalHeight/im.naturalWidth;
      ctx.save(); ctx.globalAlpha = .09; ctx.drawImage(im, wide ? W*.03 : -W*.01, wide ? (H-h)/2 : pad*2.2, w, h); ctx.restore(); }
  }
  if (st.faixa){
    const fw = Math.max(W*.075, 56*s), sk = Math.tan(14*Math.PI/180)*H, x = wide ? W*.5 : W*.78;
    ctx.fillStyle = t.faixa; ctx.beginPath(); ctx.moveTo(x+sk, 0); ctx.lineTo(x+sk+fw, 0); ctx.lineTo(x+fw, H); ctx.lineTo(x, H); ctx.fill();
  }
  let avW = 0, avTop = H;
  const tallF = H/W > 1.5;
  if (st.avatar){
    const im = await loadImg('avatar-sem-fundo', t.fg);
    if (im){ const ar = im.naturalWidth/im.naturalHeight;
      const h = wide ? H*.9 : tallF ? H*.34 : Math.min(H*.56, W*.7/ar), w = h*ar; avW = w;
      const ay = wide ? (H-h)/2 : H - h - pad*.15; avTop = ay;
      ctx.drawImage(im, W - w - pad*.3, ay, w, h); }
  }
  await topo(ctx, W, H, t, m, s, pad);
  const textW = st.avatar ? (tallF ? W - 2*pad : Math.max(W*.34, W - avW - pad*1.6)) : W - 2*pad;
  const textBottom = (st.avatar && tallF) ? avTop - 10*s : H - pad;
  bloco(ctx, {x:pad, maxW:textW, top:pad+50*s, bottom:textBottom, anchor: wide ? 'center' : 'bottom',
              s, t, m, maxTitle: wide ? H*.26 : m*.15, tags:true});
  if (!st.avatar) await rodapeSelo(ctx, W, H, t, s, pad);
}

async function Ltipografico(ctx, W, H, t){
  const m = Math.min(W,H), s = m/1080, pad = Math.round(m*.06), wide = W/H > 1.5;
  await padrao(ctx, W, H, t);
  if (st.wogigante){
    const im = await loadImg('monograma-wo', t.fg);
    if (im){ const w = W*.9, h = w*im.naturalHeight/im.naturalWidth;
      ctx.save(); ctx.globalAlpha = .07; ctx.drawImage(im, W-w*.85, H-h*1.0, w, h); ctx.restore(); }
  }
  if (st.faixa){
    const fw = Math.max(W*.06, 44*s), sk = Math.tan(14*Math.PI/180)*H, x = W*.86;
    ctx.fillStyle = t.faixa; ctx.beginPath(); ctx.moveTo(x+sk, 0); ctx.lineTo(x+sk+fw, 0); ctx.lineTo(x+fw, H); ctx.lineTo(x, H); ctx.fill();
  }
  const cl = await loadImg('canto-l', t.ac === '#1A1A1A' ? t.fg : t.bar);
  if (cl){
    const cs = Math.max(34, 70*s), g = pad*.55;
    const put = (x, y, rot) => { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.drawImage(cl, 0, 0, cs, cs); ctx.restore(); };
    put(g, g, 0); put(W-g, g, Math.PI/2); put(W-g, H-g, Math.PI); put(g, H-g, -Math.PI/2);
  }
  await topo(ctx, W, H, t, m, s, pad);
  bloco(ctx, {x:pad*1.6, maxW:W - pad*3.2, top:pad+60*s, bottom:H-pad-(st.selo ? 80*s : 20*s), anchor:'center',
              s, t, m, maxTitle: wide ? H*.34 : m*.2, tags:true});
  await rodapeSelo(ctx, W, H, t, s, pad*1.2);
  if (st.avatar){
    const im = await loadImg('avatar-sem-fundo', t.fg);
    if (im){ const ar = im.naturalWidth/im.naturalHeight, h = H*(wide ? .8 : .3), w = h*ar;
      ctx.drawImage(im, W-w-pad*1.4, H-h-pad*1.4, w, h); }
  }
}

async function Lcitacao(ctx, W, H, t){
  const m = Math.min(W,H), s = m/1080, pad = Math.round(m*.06), wide = W/H > 1.5;
  await padrao(ctx, W, H, t);
  if (st.faixa){
    const fw = Math.max(W*.05, 40*s), sk = Math.tan(14*Math.PI/180)*H, x = W*.9;
    ctx.fillStyle = t.faixa; ctx.beginPath(); ctx.moveTo(x+sk, 0); ctx.lineTo(x+sk+fw, 0); ctx.lineTo(x+fw, H); ctx.lineTo(x, H); ctx.fill();
  }
  ctx.save(); ctx.font = fontD(m*(wide ? .9 : .62)); ctx.fillStyle = t.bar; ctx.textBaseline = 'top'; ctx.globalAlpha = .95;
  ctx.fillText('“', pad*.8, pad + (wide ? -m*.12 : 40*s) - m*(wide ? .05 : .08)); ctx.restore();
  await topo(ctx, W, H, t, m, s, pad);
  const x = pad*1.6, maxW = W - pad*3.4 - (st.faixa ? W*.06 : 0);
  const ti = fitRuns(ctx, st.titulo, maxW, H*(wide ? .46 : .36), wide ? H*.2 : m*.115, 24, .98);
  const subS = Math.max(18, Math.min(36, m*.032));
  const subH = st.sub ? subS*1.4 + 40*s : 0;
  let y = (wide ? H*.26 : H*.36) + 0;
  drawRuns(ctx, ti.lay, x, y, ti.s, .98, ti.font, true, t.fg, t.ac); y += ti.h + 34*s;
  if (st.sub){
    ctx.fillStyle = t.bar; ctx.fillRect(x, y + subS*.55, 48*s, 6*s);
    ctx.font = fontT(subS); ctx.fillStyle = t.mut; ctx.textBaseline = 'top';
    monoText(ctx, st.sub, x + 72*s, y, subS*.8, t.fg, 'left', .95, .2);
  }
  if (st.tags) monoText(ctx, st.tags, pad, H - pad - Math.max(13, m*.019), Math.max(13, m*.019), t.fg, 'left', .8);
  await rodapeSelo(ctx, W, H, t, s, pad);
  if (st.avatar){
    const im = await loadImg('avatar-sem-fundo', t.fg);
    if (im){ const ar = im.naturalWidth/im.naturalHeight, h = H*(wide ? .8 : .26), w = h*ar;
      ctx.drawImage(im, W - w - pad*1.8, H - h - pad*1.8, w, h); }
  }
}

async function Lprojeto(ctx, W, H, t){
  const m = Math.min(W,H), s = m/1080, pad = Math.round(m*.06), wide = W/H > 1.5;
  await padrao(ctx, W, H, t);
  await topo(ctx, W, H, t, m, s, pad);
  let ix, iy, iw, ih;
  if (wide){ ix = W*.5; iy = pad*2.1; iw = W*.5 - pad; ih = H - iy - pad; }
  else { ix = pad; iy = pad*2.2; iw = W - 2*pad; ih = H*(H/W > 1.5 ? .4 : .5); }
  const cut = Math.max(18, 38*s);
  ctx.save(); chamfer(ctx, ix, iy, iw, ih, cut); ctx.clip();
  ctx.fillStyle = t.panel; ctx.fillRect(ix, iy, iw, ih);
  if (foto){
    const sc = Math.max(iw/foto.naturalWidth, ih/foto.naturalHeight), w = foto.naturalWidth*sc, h = foto.naturalHeight*sc;
    ctx.drawImage(foto, ix + (iw-w)/2, iy + (ih-h)/2, w, h);
  } else {
    const im = await loadImg('listras-finas', t.fg);
    if (im){ ctx.globalAlpha = .22; ctx.drawImage(im, ix, iy + (ih-iw)/2, iw, iw); ctx.globalAlpha = 1; }
    monoText(ctx, 'Imagem do projeto', ix + iw/2, iy + ih/2 - 10*s, Math.max(14, m*.02), t.fg, 'center', .7);
  }
  ctx.restore();
  const cl = await loadImg('canto-l', t.bar);
  if (cl){ const cs = Math.max(26, 44*s);
    ctx.save(); ctx.translate(ix + 16*s, iy + 16*s + cut*.4); ctx.drawImage(cl, 0, 0, cs, cs); ctx.restore(); }
  const tx = wide ? pad : pad, tw = wide ? W*.5 - pad*2 : W - 2*pad;
  const top = wide ? iy : iy + ih + 28*s, bottom = H - pad;
  bloco(ctx, {x:tx, maxW:tw, top, bottom, anchor: wide ? 'center' : 'top', s, t, m,
              maxTitle: wide ? H*.2 : m*.085, tags:true});
  await rodapeSelo(ctx, W, H, t, s, pad);
}

/* ---------- auxiliares dos layouts novos ---------- */
function monoW(ctx, txt, size, spacing=.25){
  ctx.save(); ctx.font = `500 ${size}px "JetBrains Mono",ui-monospace,monospace`;
  if ('letterSpacing' in ctx) ctx.letterSpacing = (size*spacing) + 'px';
  const w = ctx.measureText(String(txt).toUpperCase()).width; ctx.restore(); return w;
}
function parseLista(txt){
  return String(txt || '').split('\n').map(l => l.trim()).filter(Boolean).slice(0, 4).map(l => {
    const i = l.indexOf(':'); return i < 0 ? {n:l, d:''} : {n:l.slice(0,i).trim(), d:l.slice(i+1).trim()};
  });
}
async function wog(ctx, W, H, t, wide, pad, a=.09){
  if (!st.wogigante) return;
  const im = await loadImg('monograma-wo', t.fg); if (!im) return;
  const w = wide ? H*1.55 : W*1.02, h = w*im.naturalHeight/im.naturalWidth;
  ctx.save(); ctx.globalAlpha = a; ctx.drawImage(im, wide ? W*.03 : -W*.01, wide ? (H-h)/2 : pad*2.2, w, h); ctx.restore();
}
function faixaDraw(ctx, W, H, t, x, fw){
  if (!st.faixa) return;
  const sk = Math.tan(14*Math.PI/180)*H;
  ctx.fillStyle = t.faixa; ctx.beginPath(); ctx.moveTo(x+sk, 0); ctx.lineTo(x+sk+fw, 0); ctx.lineTo(x+fw, H); ctx.lineTo(x, H); ctx.fill();
}
async function avatarDraw(ctx, t, x, y, h){
  const im = await loadImg('avatar-sem-fundo', t.fg); if (!im) return 0;
  const w = h*im.naturalWidth/im.naturalHeight; ctx.drawImage(im, x, y, w, h); return w;
}
async function cantos(ctx, W, H, t, pad, s){
  const cl = await loadImg('canto-l', t.ac === '#1A1A1A' ? t.fg : t.bar); if (!cl) return;
  const cs = Math.max(30, 64*s), g = pad*.55;
  const put = (x, y, rot) => { ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.drawImage(cl, 0, 0, cs, cs); ctx.restore(); };
  put(g, g, 0); put(W-g, g, Math.PI/2); put(W-g, H-g, Math.PI); put(g, H-g, -Math.PI/2);
}
function hair(ctx, x, y, w, t, th, a=.9){
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = t.fg; ctx.fillRect(x, y, w, th); ctx.restore();
}
async function painel(ctx, im, x, y, w, h, cut, t, rotuloTxt, s, m){
  ctx.save(); chamfer(ctx, x, y, w, h, cut); ctx.clip();
  ctx.fillStyle = t.panel; ctx.fillRect(x, y, w, h);
  if (im){
    const sc = Math.max(w/im.naturalWidth, h/im.naturalHeight), iw = im.naturalWidth*sc, ih = im.naturalHeight*sc;
    ctx.drawImage(im, x + (w-iw)/2, y + (h-ih)/2, iw, ih);
  } else {
    const p = await loadImg('listras-finas', t.fg);
    if (p){ const sz = Math.max(w, h); ctx.globalAlpha = .22; ctx.drawImage(p, x + (w-sz)/2, y + (h-sz)/2, sz, sz); ctx.globalAlpha = 1; }
    monoText(ctx, 'Sua imagem aqui', x + w/2, y + h/2 - 8*s, Math.max(13, m*.018), t.fg, 'center', .6);
  }
  ctx.restore();
  if (rotuloTxt){

}

/* ---------- carrossel ---------- */
async function Lcarrossel(ctx, W, H, t){

  faixaDraw(ctx, W, H, t, wide ? W*.55 : W*.82, Math.max(W*.07, 56*s));

  bloco(ctx, {x:pad, maxW: W - 2*pad - (wide ? W*.08 : 0), top:pad + 60*s, bottom: H - pad - cs*3.4,
              anchor:'bottom', s, t, m, maxTitle: wide ? H*.3 : m*.17, tags:false});
  const by = H - pad - cs*1.4;
  monoText(ctx, st.num, pad, by, cs*1.5, t.fg, 'left', 1, .12);
  const ax2 = W - pad, ax1 = ax2 - Math.max(160, 260*s), ay = by + cs*.75, th = Math.max(3, 5*s), hd = Math.max(14, 22*s);
  monoText(ctx, 'Arraste', ax1 - 18*s, ay - cs*.5, cs, t.mut, 'right', .9, .2);
  ctx.fillStyle = t.fg; ctx.fillRect(ax1, ay - th/2, ax2 - ax1 - hd*.6, th);
  ctx.fillStyle = t.bar; ctx.beginPath(); ctx.moveTo(ax2, ay); ctx.lineTo(ax2 - hd, ay - hd*.7); ctx.lineTo(ax2 - hd, ay + hd*.7); ctx.fill();
}

/* ---------- serviços ---------- */
async function Lservicos(ctx, W, H, t){

  await topo(ctx, W, H, t, m, s, pad);
  const items = parseLista(st.lista), n = Math.max(1, items.length);
  let y = pad + 74*s;
  ctx.fillStyle = t.bar; ctx.fillRect(pad, y, 64*s, 8*s); y += 34*s;
  const ti = fitRuns(ctx, st.titulo, W - 2*pad, H*(wide ? .24 : .15), wide ? H*.2 : m*.1, 24, .92);
  drawRuns(ctx, ti.lay, pad, y, ti.s, .92, ti.font, true, t.fg, t.ac); y += ti.h;

    drawRuns(ctx, sl, pad, y, subS, 1.4, fontT(subS), false, t.mut, t.ac); y += sl.lines.length*subS*1.4; }
  const tagS = Math.max(13, m*.019), top = y + 40*s, bottom = H - pad - (st.tags || st.selo ? tagS*2.6 : 0);
  if (wide){
    const gap = 28*s, colW = (W - 2*pad - gap*(n-1))/n;

      const nm = fitRuns(ctx, it.n, colW, (bottom-top)*.22, Math.min(colW*.28, H*.15), 20, .92);
      const ny = top + 16*s + Math.max(13, m*.02)*2;
      drawRuns(ctx, nm.lay, x, ny, nm.s, .92, nm.font, true, t.fg, t.ac);
      const dS = Math.max(15, Math.min(26, m*.026)), dl = wrapRuns(ctx, parseRuns(it.d), colW, fontT(dS), false);
      drawRuns(ctx, dl, x, ny + nm.h + 14*s, dS, 1.4, fontT(dS), false, t.mut, t.ac);
    });
  } else {
    const rowH = (bottom - top)/n;
    items.forEach((it, i) => {
      const ry = top + i*rowH;
      hair(ctx, pad, ry, W - 2*pad, t, Math.max(2, 3*s));
      monoText(ctx, String(i+1).padStart(2,'0'), pad, ry + 18*s, Math.max(13, m*.02), t.bar === t.fg ? t.fg : t.bar);
      const x = pad + 110*s, mw = W - pad - x;
      const nm = fitRuns(ctx, it.n, mw, rowH*.42, Math.min(rowH*.46, m*.1), 22, .92);
      drawRuns(ctx, nm.lay, x, ry + 14*s, nm.s, .92, nm.font, true, t.fg, t.ac);
      const dS = Math.max(16, Math.min(30, m*.028)), dl = wrapRuns(ctx, parseRuns(it.d), mw, fontT(dS), false);
      drawRuns(ctx, dl, x, ry + 14*s + nm.h + 8*s, dS, 1.35, fontT(dS), false, t.mut, t.ac);
    });
  }
  if (st.tags) monoText(ctx, st.tags, pad, H - pad - tagS, tagS, t.fg, 'left', .85);

  ctx.fillStyle = t.bar; ctx.fillRect(px, py + Math.max(20, 44*s), Math.max(8, 12*s), ph - Math.max(20, 44*s)*2);

/* ---------- cartão de visita ---------- */
async function Lcartao(ctx, W, H, t){
  const m = Math.min(W,H), s = m/1080, pad = Math.round(W*.07);
  await padrao(ctx, W, H, t);
  if (st.faixa){ const z = H*.46; ctx.fillStyle = t.faixa; ctx.beginPath(); ctx.moveTo(W, H - z); ctx.lineTo(W, H); ctx.lineTo(W - z, H); ctx.closePath(); ctx.fill(); }
  let x = pad;
  if (st.avatar){ const w = await avatarDraw(ctx, t, pad*.7, H*.12, H*.8); x = pad*.7 + w + pad*.7; }
  const maxW = W - x - pad;
  const nm = fitRuns(ctx, st.titulo, maxW, H*.3, H*.19, 24, .9);
  const roleS = Math.max(12, m*.026), cS = Math.max(12, m*.025);
  const contatos = String(st.lista || '').split('\n').map(l => l.trim()).filter(Boolean).slice(0, 5);
  const cH = contatos.length * cS * 2.1;
  const total = 8*s + 22*s + nm.h + (st.sub ? 16*s + roleS*1.4 : 0) + (cH ? 40*s + cH : 0);
  let y = (H - total)/2;
  ctx.fillStyle = t.bar; ctx.fillRect(x, y, 56*s, 8*s); y += 8*s + 22*s;
  drawRuns(ctx, nm.lay, x, y, nm.s, .9, nm.font, true, t.fg, t.ac); y += nm.h;
  if (st.sub){ y += 16*s; monoText(ctx, st.sub, x, y, roleS, t.mut, 'left', 1, .16); y += roleS*1.4; }
  if (cH){ y += 40*s;
    contatos.forEach((c, i) => {
      const cy = y + i*cS*2.1;
      ctx.fillStyle = t.bar; ctx.fillRect(x, cy + cS*.35, cS*.5, cS*.5);
      monoText(ctx, c, x + cS*1.1, cy, cS, t.fg, 'left', .92, .04);
    });

  if (st.logo){ const im = await loadImg('monograma-wo', t.fg);
    if (im){ const h = Math.max(30, 42*s*1.6), w = h*im.naturalWidth/im.naturalHeight; ctx.drawImage(im, W - pad*.8 - w, pad*.7, w, h); } }
}

/* ---------- cabeçalho reutilizável: barra + título + subtítulo; devolve o y final ---------- */
function cab(ctx, W, H, t, m, s, pad, wide, fracH){
  let y = pad + 74*s;
  ctx.fillStyle = t.bar; ctx.fillRect(pad, y, 64*s, 8*s); y += 34*s;
  const ti = fitRuns(ctx, st.titulo, W - 2*pad, H*(fracH || (wide ? .24 : .15)), wide ? H*.2 : m*.1, 24, .92);
  drawRuns(ctx, ti.lay, pad, y, ti.s, .92, ti.font, true, t.fg, t.ac); y += ti.h;
  const subS = Math.max(18, Math.min(34, m*.03));
  if (st.sub){ y += 18*s; const sl = wrapRuns(ctx, parseRuns(st.sub), W - 2*pad, fontT(subS), false);
    drawRuns(ctx, sl, pad, y, subS, 1.4, fontT(subS), false, t.mut, t.ac); y += sl.lines.length*subS*1.4; }
  return y;
}
function octo(ctx, x, y, w, c){
  ctx.beginPath(); ctx.moveTo(x+c, y); ctx.lineTo(x+w-c, y); ctx.lineTo(x+w, y+c); ctx.lineTo(x+w, y+w-c);
  ctx.lineTo(x+w-c, y+w); ctx.lineTo(x+c, y+w); ctx.lineTo(x, y+w-c); ctx.lineTo(x, y+c); ctx.closePath();
}
function estrela(ctx, cx, cy, r){
  ctx.beginPath();
  for (let i = 0; i < 10; i++){ const a = -Math.PI/2 + i*Math.PI/5, rr = i % 2 ? r*.42 : r;
    const x = cx + rr*Math.cos(a), y = cy + rr*Math.sin(a); i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
  ctx.closePath(); ctx.fill();
}
function rodapeTags(ctx, W, H, t, m, pad){
  const tagS = Math.max(13, m*.019);
  if (st.tags) monoText(ctx, st.tags, pad, H - pad - tagS, tagS, t.fg, 'left', .85);
  return tagS;
}

/* ---------- processo (etapas) ---------- */
async function Lprocesso(ctx, W, H, t){
  const m = Math.min(W,H), s = m/1080, pad = Math.round(m*.06), wide = W/H > 1.5;
  await padrao(ctx, W, H, t); await wog(ctx, W, H, t, wide, pad, .06);
  faixaDraw(ctx, W, H, t, W*.9, Math.max(W*.05, 40*s));
  await topo(ctx, W, H, t, m, s, pad);
  const y = cab(ctx, W, H, t, m, s, pad, wide);
  const items = parseLista(st.lista), n = Math.max(1, items.length);
  const tagS = Math.max(13, m*.019), top = y + 44*s, bottom = H - pad - ((st.tags || st.selo) ? tagS*2.6 : 0);
  const ns = Math.max(38, 64*s);
  const node = (x, yy, i) => {
    chamfer(ctx, x, yy, ns, ns, ns*.28); ctx.fillStyle = t.bar; ctx.fill();
    monoText(ctx, String(i+1).padStart(2,'0'), x + ns/2, yy + ns/2 - ns*.17, ns*.34, t.onbar, 'center', 1, .05);
  };
  if (wide){
    const gap = 26*s, colW = (W - 2*pad - gap*(n-1))/n;
    items.forEach((it, i) => {
      const x = pad + i*(colW + gap);
      node(x, top, i);
      if (i < n-1){ ctx.save(); ctx.globalAlpha = .35; ctx.fillStyle = t.fg; ctx.fillRect(x + ns + 10*s, top + ns/2 - 1.5*s, colW + gap - ns - 20*s, Math.max(2, 3*s)); ctx.restore(); }
      const ny = top + ns + 24*s;
      const nm = fitRuns(ctx, it.n, colW, (bottom - ny)*.3, Math.min(colW*.24, H*.11), 20, .92);
      drawRuns(ctx, nm.lay, x, ny, nm.s, .92, nm.font, true, t.fg, t.ac);
      const dS = Math.max(15, Math.min(26, m*.026)), dl = wrapRuns(ctx, parseRuns(it.d), colW, fontT(dS), false);
      drawRuns(ctx, dl, x, ny + nm.h + 12*s, dS, 1.4, fontT(dS), false, t.mut, t.ac);
    });
  } else {
    const rowH = (bottom - top)/n, x = pad + ns + 30*s, mw = W - pad - x;
    items.forEach((it, i) => {
      const ry = top + i*rowH;
      node(pad, ry, i);
      if (i < n-1){ ctx.save(); ctx.globalAlpha = .35; ctx.fillStyle = t.fg; ctx.fillRect(pad + ns/2 - 1.5*s, ry + ns + 8*s, Math.max(2, 3*s), rowH - ns - 16*s); ctx.restore(); }
      const nm = fitRuns(ctx, it.n, mw, rowH*.36, Math.min(rowH*.4, m*.075), 20, .92);
      drawRuns(ctx, nm.lay, x, ry, nm.s, .92, nm.font, true, t.fg, t.ac);
      const dS = Math.max(16, Math.min(30, m*.028)), dl = wrapRuns(ctx, parseRuns(it.d), mw, fontT(dS), false);
      drawRuns(ctx, dl, x, ry + nm.h + 8*s, dS, 1.35, fontT(dS), false, t.mut, t.ac);
    });
  }
  rodapeTags(ctx, W, H, t, m, pad);
  await rodapeSelo(ctx, W, H, t, s, pad);
}

/* ---------- checklist ---------- */
async function Lchecklist(ctx, W, H, t){
  const m = Math.min(W,H), s = m/1080, pad = Math.round(m*.06), wide = W/H > 1.5;
  await padrao(ctx, W, H, t); await wog(ctx, W, H, t, wide, pad, .06);
  faixaDraw(ctx, W, H, t, W*.9, Math.max(W*.05, 40*s));
  await topo(ctx, W, H, t, m, s, pad);
  const y = cab(ctx, W, H, t, m, s, pad, wide, wide ? .22 : .14);
  const itens = String(st.lista || '').split('\n').map(l => l.trim()).filter(Boolean).slice(0, 8);
  const n = Math.max(1, itens.length), tagS = Math.max(13, m*.019);
  const top = y + 36*s, bottom = H - pad - ((st.tags || st.selo) ? tagS*2.6 : 0);
  const rowH = Math.min((bottom - top)/n, m*.15), bs = Math.min(rowH*.56, 64*s*1.1);
  const tx = pad + bs + 26*s, mw = W - pad - tx - (st.faixa ? W*.05 : 0);
  const size = Math.min(m*.052, rowH*.46), font = `600 ${size}px Inter,system-ui,sans-serif`;
  itens.forEach((txt, i) => {
    const ry = top + i*rowH;
    hair(ctx, pad, ry, W - 2*pad - (st.faixa ? W*.05 : 0), t, Math.max(1.5, 2*s), .2);
    const by = ry + (rowH - bs)/2;
    chamfer(ctx, pad, by, bs, bs, bs*.26); ctx.fillStyle = t.bar; ctx.fill();
    ctx.save(); ctx.strokeStyle = t.onbar; ctx.lineWidth = bs*.13; ctx.lineJoin = 'miter'; ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(pad + bs*.24, by + bs*.52); ctx.lineTo(pad + bs*.43, by + bs*.72); ctx.lineTo(pad + bs*.78, by + bs*.30); ctx.stroke(); ctx.restore();
    const lay = wrapRuns(ctx, parseRuns(txt), mw, font, false);
    drawRuns(ctx, lay, tx, ry + (rowH - lay.lines.length*size*1.2)/2, size, 1.2, font, false, t.fg, t.ac);
  });
  rodapeTags(ctx, W, H, t, m, pad);
  await rodapeSelo(ctx, W, H, t, s, pad);
}

/* ---------- depoimento ---------- */
async function Ldepoimento(ctx, W, H, t){
  const m = Math.min(W,H), s = m/1080, pad = Math.round(m*.06), wide = W/H > 1.5;
  await padrao(ctx, W, H, t); await wog(ctx, W, H, t, wide, pad, .05);
  faixaDraw(ctx, W, H, t, W*.9, Math.max(W*.05, 40*s));
  await topo(ctx, W, H, t, m, s, pad);
  const x = pad*1.4, maxW = W - pad*2.8 - (st.faixa ? W*.05 : 0);
  const ss = Math.max(18, (wide ? 30 : 48)*s*1.1);
  let y = pad + 90*s;
  ctx.fillStyle = t.bar; for (let i = 0; i < 5; i++) estrela(ctx, x + ss/2 + i*(ss*1.25), y + ss/2, ss/2);
  y += ss + 34*s;
  const nameH = Math.max(m*.1, 90*s) + (st.tags ? 30*s : 0);
  const maxH = (H - pad - nameH) - y - 24*s;
  let size = Math.min(m*.07, H*.12), lay, font;
  for (; size >= 20; size -= 2){
    font = `600 ${size}px Inter,system-ui,sans-serif`; lay = wrapRuns(ctx, parseRuns(st.titulo), maxW, font, false);
    if (!lay.tooWide && lay.lines.length*size*1.28 <= maxH) break;
  }
  drawRuns(ctx, lay, x, y, size, 1.28, font, false, t.fg, t.ac); y += lay.lines.length*size*1.28 + 30*s;
  ctx.fillStyle = t.bar; ctx.fillRect(x, y, 56*s, 6*s); y += 6*s + 18*s;
  const nm = fitRuns(ctx, st.sub, maxW*.7, m*.08, m*.06, 20, .95);
  drawRuns(ctx, nm.lay, x, y, nm.s, .95, nm.font, true, t.fg, t.ac); y += nm.h + 8*s;
  if (st.tags) monoText(ctx, st.tags, x, y, Math.max(13, m*.019), t.mut, 'left', 1, .2);
  if (st.avatar){ const im = await loadImg('avatar-sem-fundo', t.fg);
    if (im){ const h = H*(wide ? .55 : .2), w = h*im.naturalWidth/im.naturalHeight; ctx.drawImage(im, W - w - pad*1.6, H - h - pad, w, h); } }
  await rodapeSelo(ctx, W, H, t, s, pad);
}

/* ---------- evento / anúncio ---------- */
async function Levento(ctx, W, H, t){
  const m = Math.min(W,H), s = m/1080, pad = Math.round(m*.06), wide = W/H > 1.5;
  await padrao(ctx, W, H, t); await wog(ctx, W, H, t, wide, pad, .07);
  faixaDraw(ctx, W, H, t, W*.9, Math.max(W*.05, 40*s));
  await topo(ctx, W, H, t, m, s, pad);
  ctx.font = fontD(100);
  const w100 = ctx.measureText(String(st.num).toUpperCase()).width || 1;
  const S = Math.min(wide ? H*.5 : m*.36, 100*(W*.78 - 2*pad)/w100);
  const dy = pad + 76*s;
  ctx.font = fontD(S); ctx.fillStyle = t.ac; ctx.textBaseline = 'top'; ctx.textAlign = 'left';
  ctx.fillText(String(st.num).toUpperCase(), pad - S*.03, dy);
  const dateBottom = dy + S*.88;
  bloco(ctx, {x:pad, maxW: W - 2*pad - (st.faixa ? W*.07 : 0), top: dateBottom + 20*s, bottom: H - pad, anchor:'bottom',
              s, t, m, maxTitle: wide ? H*.16 : m*.085, tags:true});
  await rodapeSelo(ctx, W, H, t, s, pad);
}

/* ---------- comparação ---------- */
async function Lcomparacao(ctx, W, H, t){
  const m = Math.min(W,H), s = m/1080, pad = Math.round(m*.06), wide = W/H > 1.5, tall = H/W > 1.3;
  await padrao(ctx, W, H, t); await topo(ctx, W, H, t, m, s, pad);
  const y = cab(ctx, W, H, t, m, s, pad, wide, wide ? .22 : .13);
  const items = parseLista(st.lista).slice(0, 2);
  while (items.length < 2) items.push({n:'', d:''});
  const tagS = Math.max(13, m*.019), top = y + 38*s, bottom = H - pad - ((st.tags || st.selo) ? tagS*2.6 : 0);
  const gap = 24*s, cut = Math.max(18, 38*s);
  const aw = W - 2*pad, ah = bottom - top;
  const boxes = (wide || !tall) ? [[pad, top, (aw - gap)/2, ah], [pad + (aw + gap)/2, top, (aw - gap)/2, ah]]
                                : [[pad, top, aw, (ah - gap)/2], [pad, top + (ah + gap)/2, aw, (ah - gap)/2]];
  boxes.forEach((b, i) => {
    const [bx, by, bw, bh] = b, p = Math.max(22, 40*s), side = i === 0;
    ctx.save(); chamfer(ctx, bx, by, bw, bh, cut); ctx.fillStyle = side ? t.panel : t.bar; ctx.fill(); ctx.restore();
    const col = side ? t.fg : t.onbar, dcol = side ? t.mut : t.onbar;
    const nm = fitRuns(ctx, items[i].n, bw - 2*p, bh*.28, Math.min(bw*.17, m*.1), 22, .92);
    drawRuns(ctx, nm.lay, bx + p, by + p + cut*.3, nm.s, .92, nm.font, true, col, side ? t.ac : col);
    const dS = Math.max(16, Math.min(32, m*.03)), dl = wrapRuns(ctx, parseRuns(items[i].d), bw - 2*p, fontT(dS), false);
    drawRuns(ctx, dl, bx + p, by + p + cut*.3 + nm.h + 18*s, dS, 1.4, fontT(dS), false, dcol, dcol);
  });
  const vs = Math.max(54, 96*s), cx = (boxes[0][0] + boxes[0][2] + boxes[1][0])/2 * ((wide || !tall) ? 1 : 0) + ((wide || !tall) ? 0 : W/2) - vs/2,
        cy = (wide || !tall) ? top + ah/2 - vs/2 : (boxes[0][1] + boxes[0][3] + boxes[1][1])/2 - vs/2;
  octo(ctx, cx, cy, vs, vs*.28); ctx.fillStyle = t.fg; ctx.fill();
  ctx.font = fontD(vs*.5); ctx.fillStyle = t.bg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('VS', cx + vs/2, cy + vs/2 + vs*.03); ctx.textAlign = 'left';
  rodapeTags(ctx, W, H, t, m, pad);
  await rodapeSelo(ctx, W, H, t, s, pad);
}

const LAYOUTS = {poster:Lposter, tipografico:Ltipografico, citacao:Lcitacao, projeto:Lprojeto,
  carrossel:Lcarrossel, servicos:Lservicos, antesdepois:Lantesdepois, destaque:Ldestaque, cartao:Lcartao, verso:Lverso,
  processo:Lprocesso, checklist:Lchecklist, depoimento:Ldepoimento, evento:Levento, comparacao:Lcomparacao};

/* ---------------------------------------------------------------- render */
const cv = document.getElementById('cv');
let tok = 0, pendente = false;
async function render(){
  const my = ++tok, f = FORMATOS[st.formato], t = TEMAS[st.tema];
  const off = document.createElement('canvas'); off.width = f.w; off.height = f.h;
  const ctx = off.getContext('2d');
  ctx.fillStyle = t.bg; ctx.fillRect(0, 0, f.w, f.h);
  try { await LAYOUTS[st.layout](ctx, f.w, f.h, t); } catch (e){ console.error(e); }
  if (my !== tok) return;
  cv.width = f.w; cv.height = f.h; cv.getContext('2d').drawImage(off, 0, 0);
  document.getElementById('info').textContent = `${f.n} · ${LAYOUTS_NOMES[st.layout]} · ${t.n}`;
}
function agendar(){ if (pendente) return; pendente = true; requestAnimationFrame(() => { pendente = false; render(); }); }

/* ---------------------------------------------------------------- interface */
const $ = id => document.getElementById(id);
$('formato').innerHTML = Object.entries(FORMATOS).map(([k,v]) => `<option value="${k}">${v.n}</option>`).join('');
$('padrao').innerHTML = Object.entries(PADROES).map(([k,v]) => `<option value="${k}">${v}</option>`).join('');
$('layouts').innerHTML = Object.entries(LAYOUTS_NOMES).map(([k,v]) => `<button class="tag" data-l="${k}">${v}</button>`).join('');
$('temas').innerHTML = Object.entries(TEMAS).map(([k,v]) => `<button data-t="${k}" style="background:${v.bg};color:${v.fg}">${v.n}</button>`).join('');

function sincronizar(){
  $('formato').value = st.formato;
  document.querySelectorAll('[data-k]').forEach(el => {
    const v = st[el.dataset.k];
    if (el.type === 'checkbox') el.checked = !!v; else el.value = v;
  });
  document.querySelectorAll('#layouts .tag').forEach(b => b.classList.toggle('ativo', b.dataset.l === st.layout));
  document.querySelectorAll('#temas button').forEach(b => b.classList.toggle('ativo', b.dataset.t === st.tema));
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'formato'){ st.formato = el.value; agendar(); return; }
  if (!el.dataset.k) return;
  st[el.dataset.k] = el.type === 'checkbox' ? el.checked : (el.type === 'range' ? +el.value : el.value);
  agendar();
});
$('layouts').addEventListener('click', e => {
  const b = e.target.closest('[data-l]'); if (!b) return;
  st.layout = b.dataset.l; Object.assign(st, BASE, EXEMPLOS[st.layout]);
  if (st.layout === 'cartao' || st.layout === 'verso') st.formato = 'cartao';
  else if (st.formato === 'cartao') st.formato = 'post';
  sincronizar(); agendar();
});
$('temas').addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  st.tema = b.dataset.t; sincronizar(); agendar();
});
$('exemplo').addEventListener('click', () => { Object.assign(st, BASE, EXEMPLOS[st.layout]); sincronizar(); agendar(); });
function lerImagem(inputId, destino){
  $(inputId).addEventListener('change', e => {
    const f = e.target.files[0]; if (!f){ destino(null); agendar(); return; }
    const im = new Image();
    im.onload = () => { destino(im); if (st.layout !== 'projeto' && st.layout !== 'antesdepois'){ st.layout = 'projeto'; Object.assign(st, BASE, EXEMPLOS.projeto); sincronizar(); } agendar(); };
    im.src = URL.createObjectURL(f);
  });
}
lerImagem('foto',  im => { foto = im; });
lerImagem('foto2', im => { foto2 = im; });
$('baixar').addEventListener('click', () => {
  cv.toBlob(b => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = `wo-${st.layout}-${st.formato}.png`; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
});

$('baixarhtml').addEventListener('click', () => {
  const t = TEMAS[st.tema], f = FORMATOS[st.formato];
  const img = cv.toDataURL('image/png');
  const titulo = String(st.titulo).replace(/\*/g, '').replace(/\n/g, ' ').replace(/[<>&"]/g, '');
  const doc = `<!doctype html>\n<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">\n<title>${titulo} · WO</title>\n<style>html,body{margin:0;height:100%;background:${t.bg}}body{display:grid;place-items:center}img{display:block;max-width:100vw;max-height:100vh;width:auto;height:auto}</style></head>\n<body><img src="${img}" width="${f.w}" height="${f.h}" alt="${titulo}"></body></html>\n`;
  const b = new Blob([doc], {type:'text/html'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(b);
  a.download = `wo-${st.layout}-${st.formato}.html`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
});

(async () => {
  /* atalho: gerador-pecas.html#layout=servicos&tema=claro&formato=quad */
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('layout') && LAYOUTS[h.get('layout')]){
    st.layout = h.get('layout'); Object.assign(st, BASE, EXEMPLOS[st.layout]);
    st.formato = (st.layout === 'cartao' || st.layout === 'verso') ? 'cartao' : st.formato;
  }
  if (h.get('tema') && TEMAS[h.get('tema')]) st.tema = h.get('tema');
  if (h.get('formato') && FORMATOS[h.get('formato')]) st.formato = h.get('formato');
  sincronizar();
  try {
    await Promise.race([
      Promise.all([document.fonts.load('900 40px "Barlow Condensed"'), document.fonts.load('400 20px Inter'), document.fonts.load('500 20px "JetBrains Mono"')]),
      new Promise(r => setTimeout(r, 2500)),
    ]);
  } catch (e) {}
  render();
})();
</script>
